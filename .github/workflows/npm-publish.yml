name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write   # 写 tag 需要；不要省
  id-token: write   # --provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # 必须 0，tag 检测需要完整历史
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Smoke test
        run: pnpm test

      - name: Get version and package name
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Verify npm token
        # 只校验「这个 secret 还能认证」，不发任何东西。
        #
        # 为什么必须有这一步：过期/换人的 NPM_TOKEN 在普通 push 上**完全静默**——
        # 版本已发布 → 跳过 publish，工作流照样绿。于是问题一路潜行到发版当天
        # 才以 403 爆出来（本项目真实踩过：仓库里的 NPM_TOKEN 停在半个多月前的旧账号，
        # 而包 owner 是另一个账号，CI 红在 publish 那一步）。
        # 现在每次 push 都会当面验一次，失效当场变红。
        #
        # 刻意不硬编码期望的用户名：该检查要回答的是「这个 token 还能用吗」，
        # 而不是「是不是某个特定账号」——owner 变更时后者会变成假失败。
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: Check if version exists on npm
        id: npm_check
        run: |
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        # 发版是**改版本号**这个动作本身授权的：版本还没上 npm 才发布。
        # 于是「文档 / 重构 / 删功能」这类不动 package.json 的 push 只跑校验不发版。
        if: steps.npm_check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
