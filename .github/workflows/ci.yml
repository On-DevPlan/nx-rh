name: CI

# 与 npm-publish.yml 分开：那条只在 main 上跑发布，这条对每次 push / PR 做校验。
# 改造前只有发布流水线，PR 阶段没有任何护栏——冒烟测试是在发版那一刻才跑的。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint（含分层约束）
        run: pnpm run lint

      - name: 单元测试与一致性断言
        run: pnpm run test:unit

      - name: 构建前端
        run: pnpm run build

      - name: 端到端冒烟
        run: pnpm run test:smoke

  # Rust 版（prev/nx-rh-rs）的校验。与 JS 版互不依赖，可以并行。
  # 断言涵盖：action 表唯一性 / CLI 路径唯一 / 路由唯一 / 参数校验 / 错误契约。
  verify-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prev/nx-rh-rs -> target

      - name: 构建
        working-directory: prev/nx-rh-rs
        run: cargo build --release --locked

      - name: 单元测试与一致性断言
        working-directory: prev/nx-rh-rs
        run: cargo test --release --locked

      - name: 冒烟
        working-directory: prev/nx-rh-rs
        run: |
          ./target/release/nx-rh-rs version
          ./target/release/nx-rh-rs help --json | head -3
          ./target/release/nx-rh-rs routes --json | head -3

      # 两版命令面逐条对齐：action 表 / 路由表 / usage 串 / help 版面 /
      # --json 形状 / 人读输出 / 错误契约。这是「Rust 版完全一致」的机器化验收。
      # 失败时会打  ::error::  annotation，公开 API 就能读到原因（日志要登录）。
      - name: 与 JS 版对齐校验
        working-directory: prev/nx-rh-rs
        env:
          NX_RH_ROOT: ${{ github.workspace }}
          NX_RH_STORE: ${{ github.workspace }}/.ci-store.json
        run: |
          node tests/compare.cjs

      # 别名（全部 CLI 路径）单独比：help --json 只暴露主路径，
      # `bundled list` / `skill scan` / `skill adapt` 这些老名字不在里面。
      - name: 别名集合校验
        working-directory: .
        run: |
          node prev/nx-rh-rs/tests/alias-diff.mjs
